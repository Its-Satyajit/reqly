syntax = "proto3";

package reqly.test.v1;

option go_package = "github.com/Its-Satyajit/reqly/internal/grpc/testsrv;testsrv";

// EchoService is the shared fixture contract: one unary method and one
// server-streaming method covering the M43 protocol scope.
service EchoService {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc StreamEcho(EchoRequest) returns (stream EchoResponse);
}

message EchoRequest {
  string text = 1;
  map<string, string> labels = 2;
}

message EchoResponse {
  string text = 1;
  int32 sequence = 2;
  map<string, string> labels = 3;
}

service FailingService {
  rpc Boom(EchoRequest) returns (EchoResponse);
}
