name: Release

# release-please v4: on every push to main it parses Conventional Commits and
# maintains a release PR. Merging that release PR creates the semver tag and a
# GitHub Release with a generated changelog, then this workflow attaches the
# CLI binaries as release assets.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (version bump + changelog)
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: go
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.release.outputs.release_created }}

      - name: Set up Go
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build CLI binaries
        if: ${{ steps.release.outputs.release_created }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "dist/reqly-${os}-${arch}${ext}" ./apps/cli
          done
          cd dist && sha256sum reqly-* > checksums.txt

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: dist/*
