name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nubjs/setup-nub@v0
        with:
          cache-dependency-path: nub.lock
      - run: nub ci
      - run: nub run -r --if-present typecheck
      - run: nub run --filter @api-client/desktop build

  go:
    name: Go core (vet + tests + race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install system dependencies (Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go mod tidy
      - run: gofmt -l internal apps
      - run: go vet ./...
      - run: go test -race -cover ./...